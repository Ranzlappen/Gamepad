# Per-PR supply-chain gate: fails the PR when a dependency change introduces a
# high-severity (or worse) vulnerability. Needs the GitHub Dependency graph
# enabled (Settings > Code security). Adapted from repo-standards.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Run dependency-review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9  # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
